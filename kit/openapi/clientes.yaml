openapi: 3.0.3
info:
  title: Microservicio de clientes
  version: 1.0.0
  description: "**Colección:** `clientes` — Clientes registrados. Los datos de la semilla son 100% sintéticos.\n\
    \nContrato común a todos los microservicios del ejercicio.\n\n**Reglas generales**\n- El servicio\
    \ es de **solo lectura** y expone siempre las mismas rutas: `GET /health`, `GET /items` y `GET /items/{id}`.\n\
    - `GET /items` devuelve los elementos **ordenados por `id` ascendente**, con paginación `limit`/`offset`.\n\
    \  `total` es la cantidad de elementos que cumplen los filtros, sin considerar la paginación.\n- Los\
    \ filtros se combinan con AND. Los filtros de texto comparan por igualdad exacta sin distinguir mayúsculas.\n\
    - Un parámetro inválido (tipo, rango o valor fuera del enum) responde **400**. Un `id` inexistente\
    \ responde **404**.\n- Los errores usan siempre el formato `{ \"error\": \"<codigo>\", \"message\"\
    : \"<detalle>\" }`.\n- Los nombres de campos del documento coinciden con los del JSON de la semilla\
    \ (campo `id` como clave primaria).\n- Fechas en ISO 8601 UTC (`date-time`) o `YYYY-MM-DD` (`date`).\n"
  x-collection: clientes
  x-id-prefix: CLI
servers:
- url: http://localhost:3000
  description: Local
- url: https://TU-SERVICIO.onrender.com
  description: Render (reemplazar por tu URL)
tags:
- name: Servicio
  description: Estado del servicio
- name: clientes
  description: Clientes registrados. Los datos de la semilla son 100% sintéticos.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      tags:
      - Servicio
      description: Debe responder 200 si el servicio y su base de datos están operativos. `collection`
        debe coincidir con la colección que sirve este microservicio.
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    get:
      operationId: listItems
      summary: Lista de clientes
      tags:
      - clientes
      description: Devuelve una página de elementos de `clientes` ordenados por `id`.
      parameters:
      - name: ciudad
        in: query
        required: false
        description: Filtra por ciudad (coincidencia exacta, sin distinguir mayúsculas).
        schema:
          type: string
      - name: provincia
        in: query
        required: false
        description: Filtra por provincia (coincidencia exacta, sin distinguir mayúsculas).
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    get:
      operationId: getItem
      summary: Detalle de un elemento de clientes
      tags:
      - clientes
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento (por ejemplo `CLI001`).
        schema:
          type: string
      responses:
        '200':
          description: El elemento solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de elementos a devolver.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Cantidad de elementos a saltear.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: El parámetro limit debe estar entre 1 y 100.
    NotFound:
      description: No existe un elemento con ese id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No existe CLI999.
  schemas:
    Item:
      type: object
      description: Clientes registrados. Los datos de la semilla son 100% sintéticos.
      required:
      - id
      - nombre
      - email
      - ciudad
      - provincia
      - fechaAlta
      properties:
        id:
          type: string
          pattern: ^CLI[0-9]+$
          description: Identificador único del recurso.
          example: CLI001
        nombre:
          type: string
          description: Nombre completo.
          example: Lucía Fernández
        email:
          type: string
          description: Correo electrónico (dominio example.com en la semilla).
          format: email
        ciudad:
          type: string
          description: Ciudad de residencia.
          example: Bahía Blanca
        provincia:
          type: string
          description: Provincia.
          example: Buenos Aires
        fechaAlta:
          type: string
          description: Fecha de alta del cliente.
          format: date
      example:
        id: CLI001
        nombre: Lucía Fernández
        email: lucia.fernandez@example.com
        ciudad: Bahía Blanca
        provincia: Buenos Aires
        fechaAlta: '2025-03-12'
    ItemList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que cumplen los filtros.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    Health:
      type: object
      required:
      - status
      - service
      - collection
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          description: Nombre del servicio (libre; por ejemplo el del grupo).
          example: grupo-03-clientes
        collection:
          type: string
          enum:
          - clientes
        version:
          type: string
          example: 1.0.0
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - bad_request
          - not_found
        message:
          type: string
