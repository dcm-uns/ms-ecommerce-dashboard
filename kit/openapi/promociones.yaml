openapi: 3.0.3
info:
  title: Microservicio de promociones
  version: 1.0.0
  description: "**Colección:** `promociones` — Promociones de descuento. Cada una aplica a una categoría\
    \ o a un producto (exactamente uno de los dos).\n\nContrato común a todos los microservicios del ejercicio.\n\
    \n**Reglas generales**\n- El servicio es de **solo lectura** y expone siempre las mismas rutas: `GET\
    \ /health`, `GET /items` y `GET /items/{id}`.\n- `GET /items` devuelve los elementos **ordenados por\
    \ `id` ascendente**, con paginación `limit`/`offset`.\n  `total` es la cantidad de elementos que cumplen\
    \ los filtros, sin considerar la paginación.\n- Los filtros se combinan con AND. Los filtros de texto\
    \ comparan por igualdad exacta sin distinguir mayúsculas.\n- Un parámetro inválido (tipo, rango o\
    \ valor fuera del enum) responde **400**. Un `id` inexistente responde **404**.\n- Los errores usan\
    \ siempre el formato `{ \"error\": \"<codigo>\", \"message\": \"<detalle>\" }`.\n- Los nombres de\
    \ campos del documento coinciden con los del JSON de la semilla (campo `id` como clave primaria).\n\
    - Fechas en ISO 8601 UTC (`date-time`) o `YYYY-MM-DD` (`date`).\n"
  x-collection: promociones
  x-id-prefix: PRM
servers:
- url: http://localhost:3000
  description: Local
- url: https://TU-SERVICIO.onrender.com
  description: Render (reemplazar por tu URL)
tags:
- name: Servicio
  description: Estado del servicio
- name: promociones
  description: Promociones de descuento. Cada una aplica a una categoría o a un producto (exactamente
    uno de los dos).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      tags:
      - Servicio
      description: Debe responder 200 si el servicio y su base de datos están operativos. `collection`
        debe coincidir con la colección que sirve este microservicio.
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    get:
      operationId: listItems
      summary: Lista de promociones
      tags:
      - promociones
      description: Devuelve una página de elementos de `promociones` ordenados por `id`.
      parameters:
      - name: categoriaId
        in: query
        required: false
        description: Filtra por categoría.
        schema:
          type: string
          pattern: ^CAT[0-9]+$
      - name: productoId
        in: query
        required: false
        description: Filtra por producto.
        schema:
          type: string
          pattern: ^PRD[0-9]+$
      - name: vigente
        in: query
        required: false
        description: Si es true, devuelve las promociones con fechaInicio <= fecha <= fechaFin; si es
          false, las demás.
        schema:
          type: boolean
      - name: fecha
        in: query
        required: false
        description: Fecha con la que se evalúa `vigente`. Por defecto, el día actual. Útil para pruebas
          deterministas.
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    get:
      operationId: getItem
      summary: Detalle de un elemento de promociones
      tags:
      - promociones
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento (por ejemplo `PRM001`).
        schema:
          type: string
      responses:
        '200':
          description: El elemento solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de elementos a devolver.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Cantidad de elementos a saltear.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: El parámetro limit debe estar entre 1 y 100.
    NotFound:
      description: No existe un elemento con ese id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No existe PRM999.
  schemas:
    Item:
      type: object
      description: Promociones de descuento. Cada una aplica a una categoría o a un producto (exactamente
        uno de los dos).
      required:
      - id
      - nombre
      - descuentoPct
      - categoriaId
      - productoId
      - fechaInicio
      - fechaFin
      properties:
        id:
          type: string
          pattern: ^PRM[0-9]+$
          description: Identificador único del recurso.
          example: PRM001
        nombre:
          type: string
          description: Nombre de la promoción.
          example: Semana del Celular
        descuentoPct:
          type: integer
          description: Porcentaje de descuento (1 a 90).
          minimum: 1
          maximum: 90
          example: 15
        categoriaId:
          type: string
          pattern: ^CAT[0-9]+$
          description: Categoría alcanzada. Nulo si la promoción es por producto.
          example: CAT001
          nullable: true
        productoId:
          type: string
          pattern: ^PRD[0-9]+$
          description: Producto alcanzado. Nulo si la promoción es por categoría.
          example: PRD001
          nullable: true
        fechaInicio:
          type: string
          description: Primer día de vigencia (inclusive).
          format: date
        fechaFin:
          type: string
          description: Último día de vigencia (inclusive).
          format: date
      example:
        id: PRM001
        nombre: Semana del Celular
        descuentoPct: 15
        categoriaId: CAT02
        productoId: null
        fechaInicio: '2026-10-05'
        fechaFin: '2026-10-18'
    ItemList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que cumplen los filtros.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    Health:
      type: object
      required:
      - status
      - service
      - collection
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          description: Nombre del servicio (libre; por ejemplo el del grupo).
          example: grupo-03-promociones
        collection:
          type: string
          enum:
          - promociones
        version:
          type: string
          example: 1.0.0
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - bad_request
          - not_found
        message:
          type: string
