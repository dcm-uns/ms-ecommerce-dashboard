openapi: 3.0.3
info:
  title: Microservicio de envios
  version: 1.0.0
  description: "**Colección:** `envios` — Envíos de las órdenes pagadas (una vez despachadas, en tránsito\
    \ o entregadas).\n\nContrato común a todos los microservicios del ejercicio.\n\n**Reglas generales**\n\
    - El servicio es de **solo lectura** y expone siempre las mismas rutas: `GET /health`, `GET /items`\
    \ y `GET /items/{id}`.\n- `GET /items` devuelve los elementos **ordenados por `id` ascendente**, con\
    \ paginación `limit`/`offset`.\n  `total` es la cantidad de elementos que cumplen los filtros, sin\
    \ considerar la paginación.\n- Los filtros se combinan con AND. Los filtros de texto comparan por\
    \ igualdad exacta sin distinguir mayúsculas.\n- Un parámetro inválido (tipo, rango o valor fuera del\
    \ enum) responde **400**. Un `id` inexistente responde **404**.\n- Los errores usan siempre el formato\
    \ `{ \"error\": \"<codigo>\", \"message\": \"<detalle>\" }`.\n- Los nombres de campos del documento\
    \ coinciden con los del JSON de la semilla (campo `id` como clave primaria).\n- Fechas en ISO 8601\
    \ UTC (`date-time`) o `YYYY-MM-DD` (`date`).\n"
  x-collection: envios
  x-id-prefix: ENV
servers:
- url: http://localhost:3000
  description: Local
- url: https://TU-SERVICIO.onrender.com
  description: Render (reemplazar por tu URL)
tags:
- name: Servicio
  description: Estado del servicio
- name: envios
  description: Envíos de las órdenes pagadas (una vez despachadas, en tránsito o entregadas).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      tags:
      - Servicio
      description: Debe responder 200 si el servicio y su base de datos están operativos. `collection`
        debe coincidir con la colección que sirve este microservicio.
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    get:
      operationId: listItems
      summary: Lista de envios
      tags:
      - envios
      description: Devuelve una página de elementos de `envios` ordenados por `id`.
      parameters:
      - name: ordenId
        in: query
        required: false
        description: Filtra por orden.
        schema:
          type: string
          pattern: ^ORD[0-9]+$
      - name: estado
        in: query
        required: false
        description: Filtra por estado.
        schema:
          type: string
          enum:
          - preparando
          - en_transito
          - demorado
          - entregado
      - name: transportista
        in: query
        required: false
        description: Filtra por transportista (coincidencia exacta, sin distinguir mayúsculas).
        schema:
          type: string
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    get:
      operationId: getItem
      summary: Detalle de un elemento de envios
      tags:
      - envios
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento (por ejemplo `ENV001`).
        schema:
          type: string
      responses:
        '200':
          description: El elemento solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de elementos a devolver.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Cantidad de elementos a saltear.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: El parámetro limit debe estar entre 1 y 100.
    NotFound:
      description: No existe un elemento con ese id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No existe ENV999.
  schemas:
    Item:
      type: object
      description: Envíos de las órdenes pagadas (una vez despachadas, en tránsito o entregadas).
      required:
      - id
      - ordenId
      - transportista
      - estado
      - fechaDespacho
      - fechaEstimadaEntrega
      - fechaEntrega
      - destinoCiudad
      properties:
        id:
          type: string
          pattern: ^ENV[0-9]+$
          description: Identificador único del recurso.
          example: ENV001
        ordenId:
          type: string
          pattern: ^ORD[0-9]+$
          description: Orden que se envía.
          example: ORD001
        transportista:
          type: string
          description: Empresa de transporte.
          example: Correo Pampa
        estado:
          type: string
          enum:
          - preparando
          - en_transito
          - demorado
          - entregado
          description: Estado del envío.
        fechaDespacho:
          type: string
          description: Fecha y hora de despacho. Nulo si aún no salió.
          format: date-time
          nullable: true
        fechaEstimadaEntrega:
          type: string
          description: Fecha estimada de entrega.
          format: date
        fechaEntrega:
          type: string
          description: Fecha y hora de entrega efectiva. Nulo si aún no se entregó.
          format: date-time
          nullable: true
        destinoCiudad:
          type: string
          description: Ciudad de destino.
          example: Rosario
      example:
        id: ENV001
        ordenId: ORD001
        transportista: Correo Pampa
        estado: entregado
        fechaDespacho: '2026-08-11T14:22:00Z'
        fechaEstimadaEntrega: '2026-08-16'
        fechaEntrega: '2026-08-15T14:22:00Z'
        destinoCiudad: Bahía Blanca
    ItemList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que cumplen los filtros.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    Health:
      type: object
      required:
      - status
      - service
      - collection
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          description: Nombre del servicio (libre; por ejemplo el del grupo).
          example: grupo-03-envios
        collection:
          type: string
          enum:
          - envios
        version:
          type: string
          example: 1.0.0
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - bad_request
          - not_found
        message:
          type: string
