openapi: 3.0.3
info:
  title: Microservicio de pagos
  version: 1.0.0
  description: "**Colección:** `pagos` — Pagos asociados a las órdenes (uno por orden en la semilla).\n\
    \nContrato común a todos los microservicios del ejercicio.\n\n**Reglas generales**\n- El servicio\
    \ es de **solo lectura** y expone siempre las mismas rutas: `GET /health`, `GET /items` y `GET /items/{id}`.\n\
    - `GET /items` devuelve los elementos **ordenados por `id` ascendente**, con paginación `limit`/`offset`.\n\
    \  `total` es la cantidad de elementos que cumplen los filtros, sin considerar la paginación.\n- Los\
    \ filtros se combinan con AND. Los filtros de texto comparan por igualdad exacta sin distinguir mayúsculas.\n\
    - Un parámetro inválido (tipo, rango o valor fuera del enum) responde **400**. Un `id` inexistente\
    \ responde **404**.\n- Los errores usan siempre el formato `{ \"error\": \"<codigo>\", \"message\"\
    : \"<detalle>\" }`.\n- Los nombres de campos del documento coinciden con los del JSON de la semilla\
    \ (campo `id` como clave primaria).\n- Fechas en ISO 8601 UTC (`date-time`) o `YYYY-MM-DD` (`date`).\n"
  x-collection: pagos
  x-id-prefix: PAG
servers:
- url: http://localhost:3000
  description: Local
- url: https://TU-SERVICIO.onrender.com
  description: Render (reemplazar por tu URL)
tags:
- name: Servicio
  description: Estado del servicio
- name: pagos
  description: Pagos asociados a las órdenes (uno por orden en la semilla).
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      tags:
      - Servicio
      description: Debe responder 200 si el servicio y su base de datos están operativos. `collection`
        debe coincidir con la colección que sirve este microservicio.
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /items:
    get:
      operationId: listItems
      summary: Lista de pagos
      tags:
      - pagos
      description: Devuelve una página de elementos de `pagos` ordenados por `id`.
      parameters:
      - name: ordenId
        in: query
        required: false
        description: Filtra por orden.
        schema:
          type: string
          pattern: ^ORD[0-9]+$
      - name: estado
        in: query
        required: false
        description: Filtra por estado.
        schema:
          type: string
          enum:
          - pendiente
          - aprobado
          - rechazado
          - reembolsado
      - name: medio
        in: query
        required: false
        description: Filtra por medio de pago.
        schema:
          type: string
          enum:
          - tarjeta_credito
          - tarjeta_debito
          - transferencia
          - billetera_virtual
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /items/{id}:
    get:
      operationId: getItem
      summary: Detalle de un elemento de pagos
      tags:
      - pagos
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del elemento (por ejemplo `PAG001`).
        schema:
          type: string
      responses:
        '200':
          description: El elemento solicitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad máxima de elementos a devolver.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Cantidad de elementos a saltear.
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: bad_request
            message: El parámetro limit debe estar entre 1 y 100.
    NotFound:
      description: No existe un elemento con ese id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not_found
            message: No existe PAG999.
  schemas:
    Item:
      type: object
      description: Pagos asociados a las órdenes (uno por orden en la semilla).
      required:
      - id
      - ordenId
      - medio
      - monto
      - estado
      - fecha
      properties:
        id:
          type: string
          pattern: ^PAG[0-9]+$
          description: Identificador único del recurso.
          example: PAG001
        ordenId:
          type: string
          pattern: ^ORD[0-9]+$
          description: Orden que se paga.
          example: ORD001
        medio:
          type: string
          enum:
          - tarjeta_credito
          - tarjeta_debito
          - transferencia
          - billetera_virtual
          description: Medio de pago.
        monto:
          type: number
          description: Importe del pago.
          minimum: 0
          example: 450000
        estado:
          type: string
          enum:
          - pendiente
          - aprobado
          - rechazado
          - reembolsado
          description: Estado del pago.
        fecha:
          type: string
          description: Fecha y hora del pago.
          format: date-time
      example:
        id: PAG001
        ordenId: ORD001
        medio: tarjeta_credito
        monto: 450000
        estado: aprobado
        fecha: '2026-08-10T14:25:00Z'
    ItemList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
          minimum: 0
          description: Cantidad total de elementos que cumplen los filtros.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    Health:
      type: object
      required:
      - status
      - service
      - collection
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          description: Nombre del servicio (libre; por ejemplo el del grupo).
          example: grupo-03-pagos
        collection:
          type: string
          enum:
          - pagos
        version:
          type: string
          example: 1.0.0
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - bad_request
          - not_found
        message:
          type: string
